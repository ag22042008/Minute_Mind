# MinuteMind — Docker Compose
# Run with: docker compose up

services:
  minutemind:
    build: .
    ports:
      - "8501:8501"
    environment:
      # Add your API keys here or use a .env file
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
    volumes:
      # Persist downloaded audio between restarts
      - ./downloades:/app/downloades
    restart: unless-stopped
